# Every external dependency's version; package.json refers to it with `catalog:`.
catalog:
  # exemplar's packages: the latest published release, or the sibling ../exemplar checkout (.pnpmfile.mjs).
  '@exemplarjs/canonical': latest
  '@exemplarjs/catalog': latest
  '@exemplarjs/dom': latest
  '@exemplarjs/encodings-cjk': latest
  '@exemplarjs/sax': latest
  '@exemplarjs/validation': latest
  '@exemplarjs/writer': latest
  '@exemplarjs/xdm': latest
  '@exemplarjs/xinclude': latest
  '@exemplarjs/xml': latest
  '@exemplarjs/xpath': latest
  '@shikijs/vitepress-twoslash': 4.5.0
  '@types/node': 24.19.2
  lefthook: 2.2.1
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  # Twoslash checks the samples with TypeScript's JavaScript API, which 7 does not have.
  typescript: 6.0.3
  vitepress: 2.0.0-alpha.21
  vue: 3.5.44

# New dependencies must go through the catalog, at exact versions.
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
strictDepBuilds: true

# Supply-chain checks: no version younger than a week, none published with weaker provenance than an earlier one, and no transitive git or tarball dependencies.
minimumReleaseAge: 10080
# exemplar's own releases are documented as soon as they are published.
minimumReleaseAgeExclude:
  - '@exemplarjs/*'
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Only these packages may run install scripts; any other fails the install.
allowBuilds:
  esbuild: true
  lefthook: true
